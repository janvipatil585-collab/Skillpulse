services:
  - type: web
    name: skillpulse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /health
    initialDeployHook: >-
      python -m services.seed_demo_data && python -m services.forecasting
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MODEL_VERSION
        value: skillpulse-xgb-1.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: skillpulse-postgres
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: skillpulse-postgres
    databaseName: skillpulse
    user: skillpulse
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []